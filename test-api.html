<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test — ИМПЕРИЯ ВКУСА</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1D160F;
            color: #F3E8D6;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #2d5a2d; }
        .error { background: #5a2d2d; }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .product {
            background: #2a2318;
            padding: 15px;
            border-radius: 8px;
        }
        .product img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 5px;
        }
        button {
            background: #e85a4f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #d44a3f; }
    </style>
</head>
<body>
    <h1>🧪 Тест API — ИМПЕРИЯ ВКУСА</h1>
    <p>Проверка соединения с бэкендом</p>
    
    <button onclick="testAPI()">Проверить API</button>
    
    <div id="status"></div>
    <div id="products"></div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        async function testAPI() {
            const statusDiv = document.getElementById('status');
            const productsDiv = document.getElementById('products');
            
            statusDiv.innerHTML = '<div class="status">Загрузка...</div>';
            productsDiv.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE_URL}/api/products`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const products = await response.json();
                
                statusDiv.innerHTML = `<div class="status success">✅ Успешно! Загружено ${products.length} товаров</div>`;
                
                products.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'product';
                    div.innerHTML = `
                        <img src="${p.image_url ? (API_BASE_URL + '/' + p.image_url.replace(/^\//, '')) : '/img/dishes/placeholder.jpg'}" alt="${p.name}" onerror="this.src='/img/dishes/placeholder.jpg'">
                        <h3>${p.name}</h3>
                        <p>${p.category}</p>
                        <p><strong>${p.price} ₽</strong></p>
                        <p style="font-size: 12px; opacity: 0.7">${p.is_available ? '✓ В наличии' : '✗ Нет'}</p>
                    `;
                    productsDiv.appendChild(div);
                });
                
            } catch (error) {
                statusDiv.innerHTML = `<div class="status error">❌ Ошибка: ${error.message}</div>`;
                console.error('API Error:', error);
            }
        }
    </script>
</body>
</html>
